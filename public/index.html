<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <!--  Bootstrap 6 - alpha-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar bg-1 fg-2 container">
      <h1>Welcome</h1>
      <div class="d-flex align-items-center gap-3">
        <h2 id="who"></h2>
        <button
          type="button"
          id="logout"
          class="theme-danger btn-solid btn-styled"
        >
          Cerrar sesión
        </button>
      </div>
    </nav>

    <hr />

    <section id="seccionPersonas">
      <div class="container">
        <div class="d-flex justify-content-between">
          <h2>Personas</h2>
          <button
            type="button"
            id="nuevaPersona"
            class="theme-primary btn-solid btn-styled"
          >
            Nueva persona
          </button>
        </div>

        <table class="table table-hover">
          <thead>
            <tr class="table-active">
              <th>Apellidos</th>
              <th>Nombres</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th>Direccion</th>
              <th>Comandos</th>
            </tr>
          </thead>
          <tbody id="cuerpoPersonas">
            <!-- Renderizar de forma dinamica filas y celdas -->
          </tbody>
        </table>
      </div>
    </section>
    <!-- Zona modal -->
    <dialog class="dialog" id="dialogPersona">
      <div class="dialog-header">
        <h1 class="dialog-title">Persona</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="dialog"
          aria-label="Close"
        ></button>
      </div>
      <div class="dialog-body">
        <form action="" id="formPersona">
          <div class="form-field"  mt-3>
            <label for="apellidos" class="form-label">Apellidos</label>
            <input type="text" id="apellidos" class="form-control" required>
          </div>
          <div class="form-field" mt-3>
            <label for="nombres" class="form-label">Nombres</label>
            <input type="text" id="nombres" class="form-control" required>
          </div>

          <div class="form-field"  mt-3>
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" id="telefono" class="form-control" maxlength="9" minlength="9" pattern="\d+" required>
          </div>


          <div class="form-field"  mt-3>
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>

          <div class="form-field"  mt-3>
            <label for="direccion" class="form-label">Direccion</label>
            <input type="text" id="direccion" class="form-control" required>
          </div>
          
        </form>
      </div>
      <div class="dialog-footer">
        <button
          type="button"
          class="btn-solid theme-secondary"
          data-bs-dismiss="dialog"
        >
          Cerrar
        </button>
        <button type="submit" form="formPersona" class="btn-solid theme-primary">
          Guardar
        </button>
      </div>
    </dialog>

    <script src="./js/app.js"></script>
  </body>
</html>
